# Smart Police System - Configuration
spring.application.name=smart-police-backend
server.port=8080

# Database Configuration (MySQL 8.0)
spring.datasource.url=jdbc:mysql://localhost:3306/smart_police_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Properties (Zero-Trust, 256-bit secret)
smartpolice.jwt.secret=9a3f2b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a
# 15 minutes access token expiry (in milliseconds)
smartpolice.jwt.access-token-expiration-ms=900000
# 7 days rotating refresh token expiry (in milliseconds)
smartpolice.jwt.refresh-token-expiration-ms=604800000

# Rate Limiting Configuration (Bucket4j)
# Login endpoint: max 10 requests per minute per IP
smartpolice.rate-limiting.login-tokens-per-minute=10
# SOS distress endpoint: max 5 requests per minute per IP
smartpolice.rate-limiting.sos-tokens-per-minute=5
# General public endpoints: max 30 requests per minute per IP
smartpolice.rate-limiting.public-tokens-per-minute=30

# CORS Allowed Origins
smartpolice.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
